name: Build Modded APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download original APK from latest release
        run: |
          URL=$(curl -fsSL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/releases/latest \
            | jq -r '.assets[] | select(.name == "Tihtok.apk") | .url')
          curl -fSL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/octet-stream" -o app.apk "$URL"
          ls -lh app.apk

      - name: Install apktool (latest release)
        run: |
          curl -fsSL -o apktool.jar "$(curl -fsSL https://api.github.com/repos/iBotPeaches/Apktool/releases/latest | jq -r '.assets[] | select(.name | endswith(".jar")) | .browser_download_url')"
          java -jar apktool.jar --version

      - name: Decompile
        run: java -jar apktool.jar d -f -o decoded app.apk

      - name: Apply mods (overlay mods/ onto decoded/)
        run: |
          if [ -d mods ]; then
            cp -av mods/. decoded/
          else
            echo "No mods directory — building unmodded"
          fi

      - name: Build with apktool
        run: |
          mkdir -p dist
          java -jar apktool.jar b -o dist/tihtok-modded.apk decoded

      - name: Sign APK
        run: |
          KEYSTORE_B64="${{ secrets.SIGNING_KEYSTORE_B64 }}"
          KS_PASS="${{ secrets.SIGNING_STORE_PASSWORD || 'tihtok123' }}"
          KEY_PASS="${{ secrets.SIGNING_KEY_PASSWORD || 'tihtok123' }}"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > signing.jks
          else
            keytool -genkeypair -v -keystore signing.jks -alias tihtok \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KS_PASS" -keypass "$KEY_PASS" \
              -dname "CN=TihTok, OU=Mod, O=TihTok, L=IN, S=IN, C=IN"
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq zipalign apksigner
          zipalign -f -p 4 dist/tihtok-modded.apk dist/tihtok-modded-aligned.apk
          apksigner sign --ks signing.jks --ks-key-alias tihtok \
            --ks-pass "pass:$KS_PASS" --key-pass "pass:$KEY_PASS" \
            --out dist/TihTok-modded.apk dist/tihtok-modded-aligned.apk
          apksigner verify --print-certs dist/TihTok-modded.apk

      - name: Upload built APK to release
        run: |
          UPLOAD_URL=$(curl -fsSL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/releases/latest \
            | jq -r '.upload_url' | sed 's/{.*}//')
          curl -fsS -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary @dist/TihTok-modded.apk \
            "${UPLOAD_URL}?name=TihTok-modded.apk"
